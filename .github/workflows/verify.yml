name: Verify ORBIT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} · Python ${{ matrix.python }} · Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
            java: "17"
          - os: windows-2025
            python: "3.12"
            java: "25"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Install the locked Python environment
        run: uv sync --locked --managed-python --extra web --extra hosted

      - name: Install Node for browser module tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build the Java controller
        run: mvn --batch-mode --no-transfer-progress -f controller/pom.xml verify

      - name: Verify the JavaFX viewer
        run: mvn --batch-mode --no-transfer-progress -f viewer/pom.xml verify

      - name: Verify physics and controller integration
        run: uv run --locked --managed-python --extra web --extra hosted python -m unittest discover -s tests -v

      - name: Verify browser telemetry parsing and navigation
        run: node --test tests/test_browser_workspace.mjs

  container:
    name: Packaged workspace smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORBIT_APP_IMAGE: orbit-workspace:ci
      ORBIT_TARGET_BIND_IP: 127.0.0.1
      ORBIT_PUBLIC_ORIGIN: https://orbit-deployment.test
      ORBIT_ALB_ARN: arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/app/orbit/0123456789abcdef
      ORBIT_OIDC_ISSUER: https://identity.example.com/pool
      ORBIT_OIDC_CLIENT_ID: local-integration
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create temporary test secrets
        shell: bash
        run: |
          secret_dir="$(mktemp -d "$RUNNER_TEMP/orbit-deploy.XXXXXXXX")"
          openssl rand -hex 32 > "$secret_dir/job-token"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=orbit-deployment.test' -addext 'subjectAltName=DNS:orbit-deployment.test' \
            -out "$secret_dir/cert.pem" -keyout "$secret_dir/key.pem"
          chmod 0444 "$secret_dir/job-token" "$secret_dir/cert.pem" "$secret_dir/key.pem"
          {
            printf 'ORBIT_JOB_TOKEN_PATH=%s/job-token\n' "$secret_dir"
            printf 'ORBIT_TLS_CERT_PATH=%s/cert.pem\n' "$secret_dir"
            printf 'ORBIT_TLS_KEY_PATH=%s/key.pem\n' "$secret_dir"
          } >> "$GITHUB_ENV"

      - name: Build and start loopback preview
        run: docker compose -p orbit-ci-preview -f deploy/compose.yaml -f deploy/compose.preview.yaml up --build --wait --wait-timeout 90

      - name: Run, restart, and cancel missions through the packaged workspace
        run: python3 tools/smoke_container.py --restart-controller orbit-ci-preview

      - name: Verify the hosted TLS profile rejects unsigned identities
        shell: bash
        run: |
          docker compose -p orbit-ci-hosted -f deploy/compose.yaml -f deploy/compose.hosted.yaml up --wait --wait-timeout 90
          args=(--noproxy '*' --cacert "$ORBIT_TLS_CERT_PATH" --resolve 'orbit-deployment.test:8443:127.0.0.1' -H 'Host: orbit-deployment.test' -sS)
          curl "${args[@]}" --fail https://orbit-deployment.test:8443/readyz
          status="$(curl "${args[@]}" -o /dev/null -w '%{http_code}' -H 'X-Amzn-Oidc-Identity: forged-user' 'https://orbit-deployment.test:8443/api/capabilities')"
          test "$status" = 401

      - name: Clean up preview resources
        if: always()
        shell: bash
        run: |
          if [[ -n "${ORBIT_JOB_TOKEN_PATH:-}" ]]; then
            docker compose -p orbit-ci-preview -f deploy/compose.yaml -f deploy/compose.preview.yaml down --volumes
            docker compose -p orbit-ci-hosted -f deploy/compose.yaml -f deploy/compose.hosted.yaml down --volumes
            rm -f -- "$ORBIT_JOB_TOKEN_PATH" "$ORBIT_TLS_CERT_PATH" "$ORBIT_TLS_KEY_PATH"
          fi
