[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-mission-sim"
version = "0.1.0"
description = "Earth orbit propagation and mission telemetry"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.15,<2"]

[project.scripts]
orbit-sim = "orbit_sim.cli:main"
orbit-web = "orbit_sim.web:main"

[project.optional-dependencies]
web = ["waitress>=3.0.2,<4"]
hosted = ["PyJWT[crypto]>=2.15.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbit_sim = ["web_assets/*", "web_assets/missions/*.json"]
