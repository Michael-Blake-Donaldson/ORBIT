pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/orbit-common.conf;

    server {
        listen 8080;
        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_set_header Host $http_host;
            proxy_set_header X-Orbit-Owner "";
        }
    }
}
