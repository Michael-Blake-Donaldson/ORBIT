pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/orbit-common.conf;
    large_client_header_buffers 4 16k;

    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/orbit_tls_certificate;
        ssl_certificate_key /run/secrets/orbit_tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_set_header Host $http_host;
            proxy_set_header X-Orbit-Owner "";
            proxy_set_header X-Amzn-Oidc-Identity "";
            proxy_set_header X-Amzn-Oidc-Accesstoken "";
        }
    }
}
